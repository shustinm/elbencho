default:
  # Build command: docker build -f build_helpers/docker/Dockerfile.alpine-static.local --target base .
  image: 110450271409.dkr.ecr.eu-west-1.amazonaws.com/dev/elbencho:base-v2
  tags:
    - aws-general-runner-medium

stages:
  - build
  - test
  - deploy

build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    BACKTRACE_SUPPORT: "0"
    ALTHTTPSVC_SUPPORT: "0"
    S3_SUPPORT: "1"
    S3_AWSCRT: "0"
    USE_MIMALLOC: "1"
    BUILD_STATIC: "1"
  script:
    - mkdir -p artifacts
    - make clean-all
    - BIN_PATH=artifacts make -j $(nproc)
    - echo "EXE_VERSION=$(make version)" > build.env  # This prevents the need for Makefile in the deploy image
  artifacts:
    paths:
      - artifacts/
    reports:
      dotenv: build.env
    expire_in: 3 day
    
# MinIO: merge requests and branches other than dev; not on tags (tags use AWS below).
test:s3:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
  services:
    - name: minio/minio:latest
      alias: minio
      entrypoint: [""]
      command: ["minio", "server", "/data", "--console-address", ":9001"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    ELBENCHO_BIN: "${CI_PROJECT_DIR}/artifacts/elbencho"
    UV_LINK_MODE: copy
  script:
    - chmod +x artifacts/elbencho
    - apt-get update -qq && apt-get install -yqq curl > /dev/null
    - curl --retry 60 --retry-delay 1 --retry-connrefused --silent --fail --output /dev/null http://minio:9000/minio/health/live
    - >-
      cd tests && uv run pytest s3/ -v -s --tb=short --junitxml=../report.xml
      --s3endpoints=http://minio:9000
      --s3key=minioadmin
      --s3secret=minioadmin
      --s3region=us-west-1
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 7 day
  dependencies:
    - build

# Real AWS S3: dev branch and tags.
test:s3:aws:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
  variables:
    ELBENCHO_BIN: "${CI_PROJECT_DIR}/artifacts/elbencho"
    UV_LINK_MODE: copy
  script:
    - chmod +x artifacts/elbencho
    - >-
      cd tests && uv run pytest s3/ -v -s --tb=short --junitxml=../report-aws.xml
      --s3endpoints=""
      --s3region=ue-west-1
      --s3-bucket-prefix="vastdata-infra-s3ci-${CI_PIPELINE_ID}-"
  artifacts:
    when: always
    reports:
      junit: report-aws.xml
    expire_in: 7 day
  dependencies:
    - build

deploy:
  stage: deploy
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf:latest
  rules:
    - if: $CI_MERGE_REQUEST_IID  # Run on merge requests
    - if: $CI_COMMIT_TAG         # Run on tagged commits
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXE_VERSION=$CI_COMMIT_TAG
      elif [ -n "$CI_MERGE_REQUEST_IID" ]; then
        EXE_VERSION=${EXE_VERSION}.mr${CI_MERGE_REQUEST_IID}.${CI_COMMIT_SHORT_SHA}
      fi
    - TARBALL_NAME="elbencho-$EXE_VERSION-static-$(uname -m).tar.gz"
    - tar -czf $TARBALL_NAME -C ./artifacts elbencho
    - echo "Deploying $TARBALL_NAME to Artifactory..."
    - jf rt upload --url=$ARTIFACTORY_URL --user=$ARTIFACTORY_USER --password=$ARTIFACTORY_PASSWORD $TARBALL_NAME files/bencho/$TARBALL_NAME
  dependencies:
    - build
